description = "Generates a detailed task breakdown, story point estimation, and sprint plan from a design document."

prompt = """
---
description: Generates a detailed task breakdown, story point estimation, and sprint plan from a design document.
---

## User Input

```text
$ARGUMENTS
```

**Usage**: `/speckit.breakdown <design_doc_path> [options]`

**Options**:
- `--team-size <n>` (default: 2)
- `--productivity <hours/point>` (default: 2)
- `--sprint-weeks <n>` (default: 2)
- `--effective-rate <percent>` (default: 0.65)
- `--output <path>` (default: `docs/planning/<chapter>-task-breakdown.md`)
- `--optimize` (Enable efficiency optimization suggestions)

## Outline

1. **Parse Arguments**: Identify the design document path and any optional parameters from `$ARGUMENTS`.
2. **Context Loading**:
   - `read_file` the specified `<design_doc_path>`.
   - `read_file` `@docs/SRS.md` (relevant chapters).
   - `read_file` `@docs/user_requirement.md`.
   - `read_file` `@docs/mock_data.md`.
3. **Analysis**:
   - Use `sequentialthinking` (if available) or internal reasoning to:
     - Decompose the design into Epics and User Stories.
     - Estimate Story Points (Fibonacci: 1, 2, 3, 5, 8, 13, 21).
     - Calculate Team Velocity and Sprint Plans based on inputs.
4. **Document Generation (Segmented Writing)**:
   - **CRITICAL**: Do NOT generate the entire file in one go. Use multiple `write_file` (or `write_file` then `replace` / `run_shell_command` with append) steps.
   - **Language**: **Simplified Chinese (简体中文)**. All content must be in Chinese.
   - **Step 4.1**: Write the **Base Structure** (Header, Overview, Epic Summary).
   - **Step 4.2**: Append **Epic Details** (one by one or in small groups).
   - **Step 4.3**: Append **Sprint Plans**.
   - **Step 4.4**: Append **Appendices** (Dependencies, Risks, Acceptance Criteria).

## Analysis & Logic details

### 1. Epic Decomposition
- Divide functionality into P0/P1/P2 Epics.
- Assign ownership (WMS, WES, Hardware/External).

### 2. User Story Decomposition
- Format: "作为 <角色>, 我想要 <功能>, 以便 <业务价值>."
- Acceptance Criteria (验收标准): 5-10 verifiable items per story.
- **Reference**: Link back to Design Doc sections: `**详细设计参考: [@path/to/doc §Section](link)**`.
- **Estimation**: 
  - 1-3: Simple (简单)
  - 5: Complex (复杂)
  - 8: Very Complex (非常复杂)
  - 13+: Break down further.

### 3. Planning Calculation
- **Capacity** = `Team Size` * `Sprint Weeks` * 5 days * 8 hours.
- **Effective Capacity** = Capacity * `Effective Rate` (default 0.65).
- **Velocity** (Points) = Effective Capacity / (`Productivity` * 3.0 [Buffer Factor]).
  *(Adjust buffer factor 3.0-3.5 as needed for testing/integration)*.

## Output Document Template

```markdown
# X.X.X <功能名称> - 任务分解文档 (Task Breakdown)

**版本**: v1.0 | **日期**: YYYY-MM-DD
**来源**: `<design_doc_path>`

## 1. 概述 (Overview)
**团队分工**: WMS (内部), WES (内部), ...
**估算标准**: Fibonacci 数列 (1, 2, 3, 5, 8, 13, 21)
**总体规模**: X 个 Epic, 共 Y 故事点

## 2. Epic 汇总 (Epic Summary)
| ID | 名称 | 负责团队 | 故事点 | 优先级 |
|----|------|----------|--------|--------|
| ... | ... | ... | ... | ... |

## 3. 详细分解 (Detailed Breakdown)

### Epic 1: <名称>
**描述**: ...
**用户故事**:

#### US-E1-01: <标题>
- **用户故事**: 作为... 我想要... 以便...
- **验收标准**:
  - [ ] ...
- **技术要点**: ...
- **详细设计参考**: ...
- **故事点**: N (理由...)

... (重复其他 Epics) ...

## 4. 迭代计划 (Sprint Plan)
(基于计算速率的详细迭代计划)

### Sprint 1
...

## 5. 附录 (Appendices)
- 依赖关系图 (Dependency Graph)
- 风险与缓解 (Risks & Mitigation)
- 验收标准总览 (Full Acceptance Checklist)
```

## Execution Rules
1. **Verify Inputs**: Ensure the design doc exists before starting.
2. **Strict Calculation**: Show your math for the velocity and capacity in the "Overview" or a comment.
3. **Traceability**: Every User Story MUST link back to a specific section in the Design Document.
4. **Safety**: If the output file already exists, ask before overwriting or generate a unique name.
"""
